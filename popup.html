<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 280px; padding: 16px; font-family: system-ui, sans-serif; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 8px; color: #1a8917; }
    p { font-size: 13px; color: #555; line-height: 1.4; margin: 0 0 12px; }
    .btn {
      display: block; text-align: center; padding: 10px; border-radius: 6px;
      background: #1a8917; color: #fff; text-decoration: none; font-size: 14px; font-weight: 600;
    }
    .btn:hover { opacity: 0.85; }
    .note { font-size: 11px; color: #999; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Freedium Redirect</h2>
  <p>On a Medium article? Click below to open it on Freedium for a clean, ad-free read.</p>
  <a class="btn" href="#" id="open-freedium">Open on Freedium</a>
  <p class="note">Only works on Medium article pages.</p>
  <script src="popup.js"></script>
</body>
</html>
